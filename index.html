<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVG Departures</title>
    <style>
        body { background-color: #000; color: #ffcc00; font-family: monospace; padding: 20px; font-size: 20px; }
        .row { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 10px 0; }
        .line { font-weight: bold; width: 90px; color: #ffcc00; }
        .dest { flex-grow: 1; color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .time { width: 90px; text-align: right; color: #ffcc00; }
        .status { color: #888; font-size: 14px; margin-bottom: 15px; border-bottom: 1px dashed #444; padding-bottom: 5px; }
        .error { color: #ff4444; background: #220000; padding: 10px; border: 1px solid #ff4444; }
    </style>
</head>
<body>
    <div class="status" id="status">Status: 起動中...</div>
    <div id="board"></div>

    <script>
        const stationId = "900000100001"; // Alexanderplatz

        async function fetchDepartures() {
            const statusEl = document.getElementById('status');
            const boardEl = document.getElementById('board');
            statusEl.innerText = "Status: データ取得中 (" + new Date().toLocaleTimeString() + ")...";

            try {
                const res = await fetch(`https://v6.bvg.transport.rest/stops/${stationId}/departures?duration=60&results=10`);
                if (!res.ok) throw new Error("HTTPエラー Status: " + res.status);
                
                const data = await res.json();
                
                // データ構造の違い（配列かオブジェクトか）を安全に吸収
                let list = [];
                if (Array.isArray(data)) {
                    list = data;
                } else if (data && Array.isArray(data.departures)) {
                    list = data.departures;
                }

                if (list.length === 0) {
                    boardEl.innerHTML = "<div>表示できる出発予定がありません</div>";
                    statusEl.innerText = "Status: データ0件";
                    return;
                }

                boardEl.innerHTML = list.map(d => {
                    const line = (d.line && d.line.name) ? d.line.name : "---";
                    const dest = (d.destination && d.destination.name) ? d.destination.name : "不明";
                    const timeVal = d.when || d.plannedWhen;
                    const time = timeVal ? new Date(timeVal).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "--:--";

                    return `
                        <div class="row">
                            <span class="line">${line}</span>
                            <span class="dest">${dest}</span>
                            <span class="time">${time}</span>
                        </div>
                    `;
                }).join('');

                statusEl.innerText = "Status: 正常更新完了 (" + new Date().toLocaleTimeString() + ")";

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Status: エラー発生";
                boardEl.innerHTML = `<div class="error">⚠️ エラー: ${err.message}<br>通信またはAPI取得に失敗しました。</div>`;
            }
        }

        fetchDepartures();
        setInterval(fetchDepartures, 30000); // 30秒更新
    </script>
</body>
</html>
