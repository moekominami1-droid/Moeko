<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVG Departure Board</title>
    <style>
        body {
            background-color: #000;
            color: #ffcc00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            font-size: 20px;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #fff;
        }
        .row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding: 10px 0;
        }
        .line { font-weight: bold; width: 90px; color: #ffcc00; }
        .dest { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .time { width: 90px; text-align: right; color: #fff; }
        .error { color: #ff4444; font-size: 16px; margin-top: 20px; line-height: 1.5; }
        .loading { color: #888; }
    </style>
</head>
<body>
    <div class="title">BVG DEPARTURES (Alexanderplatz)</div>
    <div id="board" class="loading">データを取得中...</div>

    <script>
        const stationId = "900000100001"; // Alexanderplatz

        async function fetchDepartures() {
            const board = document.getElementById('board');
            try {
                const res = await fetch(`https://v6.bvg.transport.rest/stops/${stationId}/departures?duration=60&results=10`);
                
                if (!res.ok) {
                    throw new Error(`HTTPエラー: ${res.status} ${res.statusText}`);
                }
                
                const data = await res.json();
                
                // 配列形式とオブジェクト形式（data.departures）の両方に対応
                const list = Array.isArray(data) ? data : (data.departures || []);

                if (list.length === 0) {
                    board.innerHTML = "現在表示できる出発予定がありません。";
                    return;
                }

                board.innerHTML = list.map(d => {
                    const lineName = d.line ? d.line.name : "---";
                    const destName = d.destination ? d.destination.name : "不明";
                    const timeStr = d.when 
                        ? new Date(d.when).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                        : "--:--";

                    return `
                        <div class="row">
                            <span class="line">${lineName}</span>
                            <span class="dest">${destName}</span>
                            <span class="time">${timeStr}</span>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                board.innerHTML = `<div class="error">⚠️ エラーが発生しました:<br>${err.message}</div>`;
            }
        }

        fetchDepartures();
        setInterval(fetchDepartures, 30000); // 30秒ごとに自動更新
    </script>
</body>
</html>
