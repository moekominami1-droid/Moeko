<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVG Departures - 3 Stations</title>
    <style>
        body { background-color: #000; color: #ffcc00; font-family: monospace; padding: 15px; font-size: 18px; margin: 0; }
        .station-block { margin-bottom: 20px; }
        .station-title { font-size: 20px; font-weight: bold; color: #fff; border-bottom: 2px solid #ffcc00; padding-bottom: 4px; margin-bottom: 8px; }
        .row { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 6px 0; }
        .line { font-weight: bold; width: 80px; color: #ffcc00; }
        .dest { flex-grow: 1; color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-right: 10px; }
        .time { width: 110px; text-align: right; color: #ffcc00; }
        .time.delayed { color: #ff4444; font-weight: bold; }
        .status { color: #888; font-size: 13px; margin-bottom: 15px; border-bottom: 1px dashed #444; padding-bottom: 5px; }
        .error { color: #ff4444; font-size: 14px; }
    </style>
</head>
<body>
    <div class="status" id="status">Status: 起動中...</div>
    <div id="board"></div>

    <script>
        const stations = [
            { query: "S Gehrenseestr.", name: "S Gehrenseestr.", id: null },
            { query: "Seehausener Str.", name: "Seehausener Str.", id: null },
            { query: "S Hohenschönhausen", name: "S Hohenschönhausen", id: null }
        ];

        const minMinutesAhead = 10;
        const PRIMARY_API = "https://v6.bvg.transport.rest";
        const FALLBACK_API = "https://v6.vbb.transport.rest";

        // メインAPI失敗時にサブAPIへ自動切替する関数
        async function fetchApi(endpoint) {
            try {
                const res = await fetch(PRIMARY_API + endpoint);
                if (res.ok) return await res.json();
            } catch (e) {
                console.warn("メインAPI接続失敗。サブAPIに切り替えます。", e);
            }
            const resFallback = await fetch(FALLBACK_API + endpoint);
            if (!resFallback.ok) throw new Error("通信エラー (" + resFallback.status + ")");
            return await resFallback.json();
        }

        // 初回のみ：駅名から駅IDを特定して保持
        async function initStations() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Status: 駅情報を初期設定中...";

            for (let s of stations) {
                if (!s.id) {
                    try {
                        const locData = await fetchApi(`/locations?query=${encodeURIComponent(s.query)}&results=1`);
                        if (locData && locData.length > 0) {
                            s.id = locData[0].id;
                            s.name = locData[0].name;
                        }
                    } catch (e) {
                        console.error("駅ID取得失敗:", s.query, e);
                    }
                }
            }
        }

        async function fetchAllDepartures() {
            const statusEl = document.getElementById('status');
            const boardEl = document.getElementById('board');

            // ID未取得の場合は初期化を実行
            if (stations.some(s => !s.id)) {
                await initStations();
            }

            statusEl.innerText = "Status: データ更新中...";
            const now = Date.now();
            const minOffsetMs = minMinutesAhead * 60 * 1000;

            try {
                let htmlBlocks = [];

                // 順番にリクエストを発行して負荷を分散
                for (let s of stations) {
                    if (!s.id) {
                        htmlBlocks.push(`
                            <div class="station-block">
                                <div class="station-title">🚉 ${s.name}</div>
                                <div class="error">⚠️ 駅IDの特定に失敗しました</div>
                            </div>
                        `);
                        continue;
                    }

                    try {
                        const data = await fetchApi(`/stops/${s.id}/departures?duration=90&results=30`);
                        const rawList = Array.isArray(data) ? data : (data.departures || []);

                        const list = rawList.filter(d => {
                            const timeVal = d.when || d.plannedWhen;
                            if (!timeVal) return false;
                            const depTime = new Date(timeVal).getTime();
                            return (depTime - now) >= minOffsetMs;
                        }).slice(0, 4);

                        let rowsHtml = list.map(d => {
                            const line = (d.line && d.line.name) ? d.line.name : "---";
                            const dest = (d.destination && d.destination.name) ? d.destination.name : "不明";
                            const delaySeconds = d.delay || 0;
                            const delayMinutes = Math.floor(delaySeconds / 60);
                            const isDelayed = delayMinutes >= 1;

                            const timeVal = d.when || d.plannedWhen;
                            const timeStr = timeVal ? new Date(timeVal).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "--:--";
                            const timeDisplay = isDelayed ? `${timeStr} (+${delayMinutes})` : timeStr;
                            const timeClass = isDelayed ? "time delayed" : "time";

                            return `
                                <div class="row">
                                    <span class="line">${line}</span>
                                    <span class="dest">${dest}</span>
                                    <span class="${timeClass}">${timeDisplay}</span>
                                </div>
                            `;
                        }).join('');

                        if (list.length === 0) {
                            rowsHtml = `<div class="row"><span class="dest">${minMinutesAhead}分後以降の出発予定なし</span></div>`;
                        }

                        htmlBlocks.push(`
                            <div class="station-block">
                                <div class="station-title">🚉 ${s.name}</div>
                                ${rowsHtml}
                            </div>
                        `);

                    } catch (e) {
                        htmlBlocks.push(`
                            <div class="station-block">
                                <div class="station-title">🚉 ${s.name}</div>
                                <div class="error">⚠️ 通信失敗: ${e.message}</div>
                            </div>
                        `);
                    }
                }

                boardEl.innerHTML = htmlBlocks.join('');
                statusEl.innerText = `Status: 正常更新完了 (${new Date().toLocaleTimeString()})`;

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Status: エラー発生";
            }
        }

        async function start() {
            await initStations();
            await fetchAllDepartures();
            setInterval(fetchAllDepartures, 30000); // 30秒ごとに自動更新
        }

        start();
    </script>
</body>
</html>
